name: Build LineageOS 19.1 for Moto G22

on:
  workflow_dispatch: # Permite iniciar a build manualmente pela aba Actions do GitHub

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/local/bin/repo

      - name: Configure Git Identity
        run: |
          git config --global user.name "g4bri3ldll"
          git config --global user.email "gabrielalves.dasilva.0983@gmail.com"

      - name: Initialize Repo and Sync Source
        run: |
          mkdir -p ~/rom
          cd ~/rom
          repo init -u https://github.com/LineageOS/android.git -b lineage-19.1 --depth=1 --git-lfs
          git clone https://github.com/g4bri3ldll/android_manifest_hawaiip .repo/local_manifests
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j16
          
          # APAGA A PASTA .repo PARA LIBERAR MAIS DE 80GB DE ESPAÇO NO DISCO
          echo "Liberando espaço em disco..."
          rm -rf .repo

      - name: Start Compilation
        run: |
          cd ~/rom
          source build/envsetup.sh
          lunch lineage_hawaiip-userdebug
          mka bacon -j$(nproc --all)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LineageOS_19.1_hawaiip
          path: ~/rom/out/target/product/hawaiip/*.zip
          retention-days: 7
