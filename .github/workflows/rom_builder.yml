name: Build LineageOS 19.0 for Moto G22

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extreme Free Disk Space
        run: |
          echo "Liberando espaço agressivamente..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/local/bin/repo

      - name: Configure Git Identity
        run: |
          git config --global user.name "g4bri3ldll"
          git config --global user.email "gabrielalves.dasilva.0983@gmail.com"

      - name: Initialize Repo and Sync Source
        run: |
          mkdir -p ~/rom
          cd ~/rom
          repo init -u https://github.com/LineageOS/android.git -b lineage-19.0 --depth=1 --git-lfs
          git clone https://github.com/g4bri3ldll/android_manifest_hawaiip .repo/local_manifests
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j16
          
          echo "Apagando .repo para liberar espaço..."
          rm -rf .repo
          df -h

      - name: Analyze tree (poda dependencias indefinidas so no runner)
        run: |
          mkdir -p ~/ci-logs
          cd ~/rom
          source build/envsetup.sh
          lunch lineage_hawaiip-userdebug
          : > ~/ci-logs/pruned_deps.txt
          prev=""
          for i in $(seq 1 25); do
            if m nothing > ~/ci-logs/analysis.log 2>&1; then
              echo "Analise OK na iteracao $i"
              echo "Dependencias podadas (so na copia do runner):"
              cat ~/ci-logs/pruned_deps.txt
              exit 0
            fi
            deps=$(grep -oP 'depends on undefined module "\K[^"]+' ~/ci-logs/analysis.log | sort -u | tr '\n' ' ' || true)
            if [ -z "$deps" ]; then
              echo "Erro que NAO e dependencia indefinida:"
              grep -n "error" ~/ci-logs/analysis.log | head -n 30 || true
              tail -n 40 ~/ci-logs/analysis.log
              exit 1
            fi
            if [ "$deps" = "$prev" ]; then
              echo "Mesmas dependencias de novo, a poda nao funcionou: $deps"
              tail -n 40 ~/ci-logs/analysis.log
              exit 1
            fi
            if echo "$deps" | tr ' ' '\n' | grep -xE 'libc|libm|libdl|libutils|libcutils|liblog|libbase|libhidlbase|libbinder' > /dev/null; then
              echo "Dependencia basica do Android indefinida: arvore incompleta? Abortando."
              tail -n 40 ~/ci-logs/analysis.log
              exit 1
            fi
            prev="$deps"
            echo "[$i] podando: $deps"
            echo "$deps" | tr ' ' '\n' | sed '/^$/d' >> ~/ci-logs/pruned_deps.txt
            python3 - $deps <<'PY'
          import re, sys
          p = 'vendor/motorola/hawaiip/Android.bp'
          t = open(p).read()
          for d in sys.argv[1:]:
              t = re.sub(r'(?m)^[ \t]*"' + re.escape(d) + r'",\n', '', t)
          open(p, 'w').write(t)
          PY
          done
          echo "Limite de iteracoes atingido"
          tail -n 40 ~/ci-logs/analysis.log
          exit 1

      - name: Start Compilation
        timeout-minutes: 270
        run: |
          mkdir -p ~/ci-logs
          cd ~/rom
          source build/envsetup.sh
          lunch lineage_hawaiip-userdebug
          mka bacon -j$(nproc --all) 2>&1 | tee ~/ci-logs/build.log

      - name: Post-build dependency check
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ~/ci-logs
          [ -d ~/rom/out/target/product/hawaiip/vendor ] || { echo "sem imagem vendor para checar"; exit 0; }
          python3 - <<'PY' | tee ~/ci-logs/missing_deps.txt
          import collections, os, subprocess
          OUT = os.path.expanduser('~/rom/out/target/product/hawaiip')
          provided = set()
          for d in ('system', 'vendor', 'odm', 'system_ext', 'product', 'symbols'):
              for _, _, files in os.walk(os.path.join(OUT, d)):
                  provided.update(files)
          def is_elf(p):
              try:
                  with open(p, 'rb') as f:
                      return f.read(4) == b'\x7fELF'
              except OSError:
                  return False
          def needed(p):
              out = subprocess.run(['readelf', '-d', p], capture_output=True, text=True).stdout
              return [l.split('[', 1)[1].split(']', 1)[0] for l in out.splitlines() if '(NEEDED)' in l]
          missing = collections.defaultdict(set)
          for part in ('vendor', 'odm'):
              for root, _, files in os.walk(os.path.join(OUT, part)):
                  for f in files:
                      p = os.path.join(root, f)
                      if os.path.isfile(p) and is_elf(p):
                          for n in needed(p):
                              if n not in provided:
                                  missing[n].add(os.path.relpath(p, OUT))
          print(f'{len(missing)} libs pedidas por blobs do vendor e nao encontradas na build')
          for n in sorted(missing):
              print(f'{n} [{len(missing[n])}] ex: ' + ', '.join(sorted(missing[n])[:2]))
          PY

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LineageOS_19.1_hawaiip
          path: ~/rom/out/target/product/hawaiip/*.zip
          retention-days: 7

      - name: Upload CI logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-hawaiip
          path: ~/ci-logs/
          if-no-files-found: ignore
          retention-days: 7
