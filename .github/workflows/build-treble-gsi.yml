name: Build TrebleDroid LineageOS GSI

on:
  workflow_dispatch:
    inputs:
      lineage_branch:
        description: "Branch do LineageOS (o treble_manifest android-12.0 e baseado no Android 12.1)"
        required: true
        default: "lineage-19.1"
      lunch_target:
        description: "Alvo do lunch (A/B vanilla: treble_arm64_bvN-userdebug | A-only: treble_arm64_avN-userdebug)"
        required: true
        default: "treble_arm64_bvN-userdebug"
      maximize_space:
        description: "Usar maximize-build-space (junta o disco raiz com o /mnt). Desmarque para usar so o disco raiz + swap simples"
        type: boolean
        required: true
        default: true

env:
  BUILD_ROOT: /home/runner/build
  ROM_DIR: /home/runner/build/rom
  CCACHE_DIR: /home/runner/build/ccache
  ARTIFACT_DIR: /home/runner/build/artifacts
  LOG_DIR: /home/runner/build/logs

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Limpar software pre-instalado
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Instalar dependencias de build
        run: |
          sudo apt-get -o Acquire::Languages=none update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush python3 python-is-python3 rsync schedtool squashfs-tools xsltproc xz-utils yasm zip unzip zlib1g-dev

      - name: Maximizar espaco de build e criar swap
        if: ${{ inputs.maximize_space }}
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 100
          swap-size-mb: 8192
          build-mount-path: /home/runner/build
          build-mount-path-ownership: runner:runner
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Migrar HOME para a particao de build (104GB)
        run: |
          # Cria a nova estrutura HOME dentro do disco grande
          mkdir -p /home/runner/build/home
          
          # Move arquivos de configuração essenciais se existirem
          cp -r ~/.gitconfig ~/.ssh /home/runner/build/home/ 2>/dev/null || true
          
          # Substitui a pasta HOME do sistema por um link simbólico apontando para o disco de build
          sudo sed -i 's|/home/runner:|/home/runner/build/home:|g' /etc/passwd
          export HOME=/home/runner/build/home
          
          echo "HOME atualizado para: $HOME"
          df -h

      - name: Instalar a ferramenta repo
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/local/bin/repo

      - name: Configurar identidade do Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install

      - name: Restaurar cache do ccache
        id: ccache_restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ inputs.lineage_branch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ inputs.lineage_branch }}-

      - name: Inicializar repo, adicionar manifesto TrebleDroid e sincronizar
        timeout-minutes: 120
        env:
          LINEAGE_BRANCH: ${{ inputs.lineage_branch }}
        run: |
          set -euo pipefail
          mkdir -p "$ROM_DIR"
          cd "$ROM_DIR"

          repo init -u https://github.com/LineageOS/android.git -b "$LINEAGE_BRANCH" --depth=1 --git-lfs

          git clone --depth=1 https://github.com/phhusson/treble_manifest .repo/local_manifests -b android-12.0

          rm -f .repo/local_manifests/replace.xml

          repo manifest -o /tmp/resolved-manifest.xml

          ok=0
          for i in 1 2 3; do
            if repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j4; then
              ok=1
              break
            fi
            echo "repo sync falhou (tentativa $i/3). Nova tentativa em 30s..."
            sleep 30
          done
          [ "$ok" = 1 ] || { echo "repo sync falhou nas 3 tentativas"; exit 1; }
          df -h "$BUILD_ROOT"

          ( cd device/phh/treble && bash generate.sh vendor/lineage/config/common_full_phone.mk )

          echo "Apagando .repo para liberar espaco..."
          rm -rf .repo
          df -h "$BUILD_ROOT"

      - name: Compilar a GSI
        timeout-minutes: 235
        env:
          LUNCH_TARGET: ${{ inputs.lunch_target }}
        run: |
          set -o pipefail
          mkdir -p "$LOG_DIR" "$CCACHE_DIR"
          cd "$ROM_DIR"

          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"
          export CCACHE_DIR
          export CCACHE_COMPRESS=1
          ccache -M 8G
          export LC_ALL=C

          source build/envsetup.sh
          lunch "$LUNCH_TARGET"
          WITHOUT_CHECK_API=true make -j"$(nproc --all)" systemimage 2>&1 | tee "$LOG_DIR/build.log"

      - name: Verificar tamanho do ccache
        id: ccache_size
        if: always()
        run: |
          size=$(du -sm "$CCACHE_DIR" 2>/dev/null | cut -f1 || true)
          size=${size:-0}
          echo "ccache: ${size} MB"
          if [ "$size" -gt 300 ]; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "save=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Salvar cache do ccache
        if: always() && steps.ccache_size.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache_restore.outputs.cache-primary-key }}

      - name: Compactar a system.img
        if: success()
        env:
          LINEAGE_BRANCH: ${{ inputs.lineage_branch }}
          LUNCH_TARGET: ${{ inputs.lunch_target }}
        run: |
          set -euo pipefail
          IMG=$(find "$ROM_DIR/out/target/product" -maxdepth 2 -name system.img -print -quit)
          [ -n "$IMG" ] || { echo "system.img nao encontrada"; exit 1; }
          ls -lh "$IMG"
          mkdir -p "$ARTIFACT_DIR"
          xz -9 -T0 -v -c "$IMG" > "$ARTIFACT_DIR/TrebleDroid-${LINEAGE_BRANCH}-${LUNCH_TARGET%-*}.img.xz"
          ls -lh "$ARTIFACT_DIR"

      - name: Enviar GSI como artefato
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrebleDroid_LineageOS_GSI
          path: ${{ env.ARTIFACT_DIR }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Coletar logs de erro
        if: always()
        run: |
          mkdir -p "$LOG_DIR"
          cp "$ROM_DIR/out/error.log" "$LOG_DIR/" 2>/dev/null || true

      - name: Enviar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-gsi
          path: ${{ env.LOG_DIR }}
          if-no-files-found: ignore
          retention-days: 7
